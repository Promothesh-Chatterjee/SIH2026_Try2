data_dir: "D:/TSRD_data"
output_dir: "checkpoints"
seed: 42
subset: "train"
mode: "scan"
world_mode: "stare"
observation_mode: "scan"
training_mode: "real_tsrd"
deinterleaver_ckpt: "checkpoints/deinterleaver/best.pt"
normalization_stats: "checkpoints/deinterleaver/normalization_stats.json"
deinterleaver:
  batch_size: 8
  max_pulses_per_train: 2048    # truncate/sample long pulse trains
  epochs: 50
  lr: 3e-4
  weight_decay: 1e-5
  scheduler: cosine
  warmup_steps: 500
  save_every: 5
  val_every: 2
  mode: "scan"
  val_mode: "scan"

scheduler:
  total_timesteps: 500000
  replay_buffer_size: 50000
  batch_size: 32
  seq_len: 16                   # DRQN sequence length for BPTT
  update_freq: 4
  target_update_freq: 1000
  thompson_warmup_steps: 5000   # Use Thompson Sampling before DRQN exploitation
  dwell_slots: 5                # time slots per action

environment:
  n_bands: 36
  band_features: 10            # belief features per band -> obs_dim = 36*10 = 360
  obs_dim: 360
  freq_min_mhz: 0.0
  freq_max_mhz: 18000.0
  ibw_mhz: 500.0               # instantaneous bandwidth (MHz)
  dwell_time_us: 500.0         # receiver dwell per action
  detection_threshold_db: -140.0
  frequency_step_mhz: 500.0
  time_horizon_us: 30000000.0  # cap scenario ToA; ~30 s spans TSRD scan files
  max_pulses: 50000
  max_steps_per_episode: 1000
