# Gate 2 Bounded Continuation Configuration (25,500 to 26,500)
# DRDO SIH2026 Problem Statement: Smart Scan Strategy for Electronic Warfare
# Experiment: Gate 2 Bounded Mode-Preserved Continuation (Parent: checkpoint_step_25500.pt)

experiment:
  name: gate2_bounded_continuation_25500_to_26500
  baseline_checkpoint_sha256: "7a99c659affda277fa63fd612a3564d08a8d2e3cf7d033fe892d778871c186b0"
  parent_checkpoint_sha256: "777de9b4760389e4eb1bc07e232d1ac6bd34af69e8e369b758893fb6c678e554"
  reservoir_sha256: "edcef07b020563aefeac99fa3b03c2c6a474f07afdac7660e61e336523b8fe0c"
  start_step: 25500
  target_step: 26500
  episode_length: 250
  freeze_advantage_head: true
  auxiliary_heads_enabled: true
  baseline_aux_coef: 0.1

training:
  start_step: 25500
  target_step: 26500  # Strictly bounded horizon: 1,000 steps
  eval_frequency: 250  # Canonical 10-scenario evaluation evaluated every 250 steps
  save_frequency: 250  # Intermediate candidate checkpoint saved prior to each 250-step evaluation
  max_steps_per_episode: 250  # Rapid scenario mixing
  val_steps_per_scenario: 1000  # 10 canonical scenarios * 1000 = 10,000 eval steps

learning_rate:
  gate_2_25500_26500: 2.5e-5  # Staged down to 0.25x of original 1.0e-4 to prevent sparse-track drift

optimization:
  gradient_clip_norm: 5.0
  target_update_freq: 250
  q_reg_coef: 5.0e-4
  target_q_clamping_enabled: false
  gamma: 0.99
  update_freq: 4
  batch_size: 32
  aux_coef: 0.1

exploration:
  mode: controlled_staged
  gate_2:
    eps_start: 0.06
    eps_end: 0.05

replay:
  sampler: stratified_mode_anchored
  capacity: 50000
  seq_len: 16
  burn_in: 8
  require_exact_source_counts: true
  baseline_reservoir_path: "cognitive_ew_smart_scan/checkpoints/production_baseline/baseline_reservoir_5k.pkl"
  mode_quotas:
    mode_0: 0.15      # SHORT_DWELL
    mode_1: 0.25      # NORMAL_DWELL
    mode_2: 0.30      # LONG_DWELL
    mode_3: 0.15      # REVISIT
    mode_4: 0.15      # PREEMPTIVE_INTERCEPT

operational_gate_thresholds:
  min_mean_ir: 60.45
  min_agile_ir: 46.70
  min_worst_case_ir: 12.40
  min_pd: 99.80
  max_pd: 99.90
  max_pfa: 0.0000
  min_mode2_fraction_agile_sparse: 0.90
  max_advantage_head_drift: 0.0000

safety_thresholds:
  hard_safety_halt:
    max_q: 50.0
    top_band_dominance: 0.80
    unique_bands: 6
    action_entropy: 0.80
    nan_inf_check: true
  diagnostic_warning:
    max_q: 25.0
    top_band_dominance: 0.60
    unique_bands: 12
    action_entropy: 1.20

checkpoints:
  baseline_frozen: "cognitive_ew_smart_scan/checkpoints/production_baseline/checkpoint_gate_25000_frozen.pt"
  parent_champion_frozen: "cognitive_ew_smart_scan/checkpoints/safe_continuation_candidate/checkpoint_step_25500.pt"
  output_candidate_dir: "cognitive_ew_smart_scan/checkpoints/gate2_bounded_candidate"
  audit_log_path: "cognitive_ew_smart_scan/reports/gate2_bounded_audit_log.json"
