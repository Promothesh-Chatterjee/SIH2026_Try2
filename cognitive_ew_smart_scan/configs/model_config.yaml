deinterleaver:
  pdw_dim: 6  # 6D due to ToA, CF, PW, sin(AoA), cos(AoA), Amplitude
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  embed_dim: 64
  triplet_margin: 0.5

drqn_scheduler:
  n_bands: 36
  n_modes: 5
  n_actions: 180         # n_bands * n_modes (time-frequency joint action space)
  lstm_hidden: 256
  lstm_layers: 2
  obs_dim: 360         # n_bands * band_features (36 * 10 belief features)
  gamma: 0.99
  lr: 1e-4
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 87837

# Canonical time-frequency action encoding.
# action = band * n_modes + mode_index  (band in [0, n_bands), mode_index in [0, n_modes))
# dwell_us(base) = base_dwell_time_us * multiplier
dwell_modes:
  base_dwell_time_us: 500.0
  mode_multipliers:
    - name: SHORT_DWELL
      multiplier: 0.25
    - name: NORMAL_DWELL
      multiplier: 1.0
    - name: LONG_DWELL
      multiplier: 2.5
    - name: REVISIT
      multiplier: 1.0
    - name: PREEMPTIVE_INTERCEPT
      multiplier: 1.0

smartscan_moe:
  eager_weight: 0.6
  revisit_weight: 0.3
  preemptive_weight: 0.1  # fraction of selections driven by periodic-intercept urgency
  semantic_weight: 1.0    # mode semantic intent: REVISIT/REEMPTIVE/LONG linked to their drivers
  k_receivers: 1
  decay_rate: 0.05
  confidence_margin_threshold: 0.020  # calibrated Gate 10k threshold
  tau: 0.15                           # calibrated Boltzmann temperature

reward:
  penalize_empty_dwell: false  # clean empty dwells (TN) receive 0.0 false alarm penalty
  context_scaled_miss: true    # miss penalty scaled by belief occupancy probability
  w_hit: 5.0                   # per-intercept primary incentive
  w_novel: 5.0                 # novel-emitter discovery bonus
  w_miss: -0.5                 # miss penalty
  w_timing: 0.001              # per-µs timing penalty on hits
  w_priority: 1.0              # bonus scaled by priority of intercepted emitters
  w_information_gain: 0.2      # belief-entropy/novelty gain bonus
  w_false_alarm: -0.5          # penalty for spurious receiver false alarm (FP)
  w_dwell_cost: -0.0002        # per-µs cost of receiver dwell (0.100 for 500µs normal dwell)
  w_redundant_scan: 0.0        # zero redundant scan penalty (no artificial penalty on active tracks)
  w_delay: -0.5                # penalty for late preemptive intercept of overdue periodic emitters
  w_staleness: 0.4             # intrinsic staleness bonus (balanced against interception)
  w_missed_coverage: -0.2      # operational coverage opportunity loss when other bands active
  staleness_norm: 50.0         # normalization age horizon for revisit age
  conditional_dwell_cost: true # 0 cost on hit, 10% on active track (p>=0.5), full on empty dwell
  w_active_track: 2.0          # productive tracking bonus on confirmed detection on active track
  w_pulse_scale: 0.0           # pulse-count aware hit scaling
  lull_tolerance: false        # zero miss penalty on 1-dwell gaps for confirmed active tracks
  w_latency: 1.0               # early-interception bonus: w_latency * exp(-t_hit / tau_latency) on hits
  tau_latency: 100.0           # exponential decay constant in µs
  w_prediction: 0.5            # bonus for correctly intercepting a predicted agile arrival
  disable_latency_reward: false # ablation switch for zero-latency-reward diagnostic runs

belief:
  priority:
    staleness_weight: 0.35
    occupancy_weight: 0.25
    uncertainty_weight: 0.20
    periodic_weight: 0.10
    semantic_weight: 0.10

semantic_memory_enabled: false  # disabled for clean DRQN ablation baseline
