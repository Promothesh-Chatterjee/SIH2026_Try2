deinterleaver:
  pdw_dim: 6  # 6D due to ToA, CF, PW, sin(AoA), cos(AoA), Amplitude
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  embed_dim: 64
  triplet_margin: 0.5

drqn_scheduler:
  n_bands: 36
  lstm_hidden: 256
  lstm_layers: 2
  obs_dim: 360         # n_bands * band_features (36 * 10 belief features)
  gamma: 0.99
  lr: 1e-4
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 10000

smartscan_moe:
  eager_weight: 0.6
  revisit_weight: 0.4
  k_receivers: 1
  decay_rate: 0.05

reward:
  w_hit: 1.0    # per-intercept reward
  w_novel: 2.0  # novel-emitter bonus
  w_miss: -1.0  # miss penalty (<=0)
  w_timing: 0.001  # per-µs timing penalty on hits
