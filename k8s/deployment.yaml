apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartscan-api
  labels:
    app: smartscan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartscan-api
  template:
    metadata:
      labels:
        app: smartscan-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: smartscan-api
        image: ghcr.io/promothesh-chatterjee/sih2026_try2:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "production"
        - name: DEVICE
          value: "cpu"
        - name: TSRD_DATA_ROOT
          value: "/mnt/tsrd"
        - name: SMARTSCAN_API_KEY
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: api-key
              optional: true
        - name: SMARTSCAN_API_KEYS
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: api-key
              optional: true
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: azure-storage-connection-string
              optional: true
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: tsrd-volume
          mountPath: /mnt/tsrd
      volumes:
      - name: tsrd-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smartscan-api-svc
  labels:
    app: smartscan-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: smartscan-api
