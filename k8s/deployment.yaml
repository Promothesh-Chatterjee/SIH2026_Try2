apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartscan-api
  labels:
    app: smartscan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartscan-api
  template:
    metadata:
      labels:
        app: smartscan-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      - name: download-checkpoint
        image: mcr.microsoft.com/azure-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          az storage blob download \
            --account-name smartscanstore4301 \
            --container-name smartscan-models \
            --name "scheduler_v2/checkpoint_gate_25000_frozen.pt" \
            --file /mnt/models/checkpoint_gate_25000_frozen.pt \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --no-progress || echo "Checkpoint download failed — will use bundled weights"
        env:
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: azure-storage-connection-string
              optional: true
        volumeMounts:
        - name: model-volume
          mountPath: /mnt/models
      containers:
      - name: smartscan-api
        image: ghcr.io/promothesh-chatterjee/sih2026_try2:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "production"
        - name: DEVICE
          value: "cpu"
        - name: CHECKPOINT_PATH
          value: "/mnt/models/checkpoint_gate_25000_frozen.pt"
        - name: TSRD_DATA_ROOT
          value: "/mnt/tsrd"
        - name: TSRD_OPTIONAL
          value: "true"
        - name: SMARTSCAN_API_KEY
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: api-key
              optional: true
        - name: SMARTSCAN_API_KEYS
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: api-key
              optional: true
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: smartscan-secrets
              key: azure-storage-connection-string
              optional: true
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: tsrd-volume
          mountPath: /mnt/tsrd
        - name: model-volume
          mountPath: /mnt/models
      volumes:
      - name: tsrd-volume
        emptyDir: {}
      - name: model-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smartscan-api-svc
  labels:
    app: smartscan-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: smartscan-api
