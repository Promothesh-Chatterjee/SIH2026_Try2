services:
  - type: web
    name: smartscan-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -e ".[render]"
    startCommand: python -m uvicorn ew_core.deployment.api:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVICE
        value: cpu
      - key: CORS_ORIGINS
        value: "https://sih-2026-try2.vercel.app"
      - key: EXPECTED_NORMALIZATION_HASH
        value: "bacee02ac1c29428"
      - key: SCHEDULER_POLICY_MODE
        value: "operational"
      - key: SCHEDULER_EXPLORATION_ENABLED
        value: "false"
