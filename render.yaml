services:
  - type: web
    name: smartscan-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r cognitive_ew_smart_scan/requirements-render.txt
    startCommand: python -m uvicorn src.deployment.api:app --app-dir cognitive_ew_smart_scan --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVICE
        value: cpu
      - key: CORS_ORIGINS
        value: "https://sih-2026-try2.vercel.app"
