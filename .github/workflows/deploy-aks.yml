name: Deploy to Azure AKS

on:
  workflow_run:
    workflows: ["Build and Push Docker Image to GHCR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group smartscan-rg \
            --name smartscan-aks \
            --overwrite-existing

      - name: Check AKS power state and start if stopped
        run: |
          POWER_STATE=$(az aks show \
            --name smartscan-aks \
            --resource-group smartscan-rg \
            --query "powerState.code" -o tsv)
          echo "AKS power state: $POWER_STATE"
          if [ "$POWER_STATE" == "Stopped" ]; then
            echo "Starting AKS cluster..."
            az aks start --name smartscan-aks --resource-group smartscan-rg
            echo "Waiting 90 seconds for cluster to become ready..."
            sleep 90
          fi

      - name: Get new image SHA tag from GHCR
        id: image
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          IMAGE="ghcr.io/promothesh-chatterjee/sih2026_try2:sha-${SHORT_SHA}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Deploying image: ${IMAGE}"

      - name: Update AKS deployment with new image
        run: |
          kubectl set image deployment/smartscan-api \
            smartscan-api=${{ steps.image.outputs.image }} \
            --record=false
          echo "Waiting for rollout to complete (timeout: 120s)..."
          kubectl rollout status deployment/smartscan-api --timeout=120s

      - name: Run smoke test against live AKS endpoint
        run: |
          pip install requests websocket-client --quiet
          python scripts/smoke_test.py \
            --api_url http://172.198.227.59 \
            --api_key "${{ secrets.SMARTSCAN_API_KEY }}"

      - name: Stop AKS cluster to save credits (post-deploy)
        if: always()
        run: |
          az aks stop --name smartscan-aks --resource-group smartscan-rg
          echo "AKS cluster stopped. Credits preserved."
